name: Publish to npm

# 打 v* tag 即自动发布 npm；npm 侧需先配置 Trusted Publisher（OIDC，免令牌/免 OTP，兼容 2FA）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 升级 npm 到 >= 11.5.1（OIDC 可信发布要求）
        run: npm install -g npm@^11

      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          ver="$(node -p "require('./package.json').version")"
          echo "tag=$tag  version=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag（v$tag）与 package.json 版本（$ver）不一致，拒绝发布"
            exit 1
          fi

      - name: 已发布则跳过
        id: guard
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          ver="$(node -p "require('./package.json').version")"
          if npm view "${name}@${ver}" version > /dev/null 2>&1; then
            echo "::notice::${name}@${ver} 已在 npm，跳过发布"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${name}@${ver} 尚未发布，准备发布"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 发布到 npm（OIDC 可信发布，自动 provenance）
        if: steps.guard.outputs.skip != 'true'
        run: npm publish --access public
